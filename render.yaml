services:
  - type: web
    name: daily-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      - key: TIMEZONE
        value: Asia/Novokuznetsk
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./planner.db